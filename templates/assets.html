<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assets — Admin Portal</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                                <div>
                    <h3>IT Helpdesk</h3>
                    <small>Admin Portal</small>
                </div>
            </div>
        </div>
        <ul class="sidebar-nav">
            <li class="nav-section-label">Main</li>
            <li><a href="/admin_dashboard">Dashboard</a></li>
            <li><a href="/tickets">Tickets</a></li>
            <li><a href="/assets" class="active">Assets</a></li>
            <li class="nav-section-label">Manage</li>
            <li><a href="/users">Users</a></li>
            <li><a href="/technicians">Technicians</a></li>
            <li><a href="/categories">Categories</a></li>
            <li><a href="/sla_policies">SLA Policies</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="/logout" class="logout-btn">Sign Out</a>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h2>Asset Management</h2>
            <div class="topbar-user">
                <span class="user-dot"></span>
                {{ session['name'] }}
            </div>
        </div>

        <div class="content">
            <div class="card">
                <div class="card-header">
                    <h3>Add New Asset</h3>
                </div>
                <div class="card-body">
                    <form id="add-asset-form">
                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem;">
                            <div class="form-group">
                                <label>Asset Tag</label>
                                <input type="text" id="a-tag" class="form-control" placeholder="e.g. ASSET-001" required>
                            </div>
                            <div class="form-group">
                                <label>Type</label>
                                <input type="text" id="a-type" class="form-control" placeholder="e.g. Laptop, Monitor" required>
                            </div>
                            <div class="form-group">
                                <label>Serial Number</label>
                                <input type="text" id="a-serial" class="form-control" placeholder="Optional">
                            </div>
                            <div class="form-group">
                                <label>Purchase Date</label>
                                <input type="date" id="a-purchase" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Warranty End</label>
                                <input type="date" id="a-warranty" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Status</label>
                                <select id="a-status" class="form-control">
                                    <option value="Available">Available</option>
                                    <option value="Assigned">Assigned</option>
                                    <option value="Maintenance">Maintenance</option>
                                    <option value="Retired">Retired</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width:auto; margin-top:0.5rem;"> Add Asset</button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>All Assets</h3>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Asset Tag</th>
                                <th>Type</th>
                                <th>Serial No</th>
                                <th>Purchase Date</th>
                                <th>Warranty End</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="assets-table-body">
                            <!-- Loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/assets.js"></script>
</body>

</html>
