<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users — Admin Portal</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                                <div>
                    <h3>IT Helpdesk</h3>
                    <small>Admin Portal</small>
                </div>
            </div>
        </div>
        <ul class="sidebar-nav">
            <li class="nav-section-label">Main</li>
            <li><a href="/admin_dashboard">Dashboard</a></li>
            <li><a href="/tickets">Tickets</a></li>
            <li><a href="/assets">Assets</a></li>
            <li class="nav-section-label">Manage</li>
            <li><a href="/users" class="active">Users</a></li>
            <li><a href="/technicians">Technicians</a></li>
            <li><a href="/categories"><span class="nav-icon">️</span> Categories</a></li>
            <li><a href="/sla_policies">SLA Policies</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="/logout" class="logout-btn">Sign Out</a>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h2>User Management</h2>
            <div class="topbar-user">
                <span class="user-dot"></span>
                {{ session['name'] }}
            </div>
        </div>

        <div class="content">
            <div class="card">
                <div class="card-header">
                    <h3>️ All Users</h3>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Department</th>
                                <th>Created At</th>
                            </tr>
                        </thead>
                        <tbody id="users-body">
                            <!-- Loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        const ROLE_BADGE = { admin: 'badge-high', technician: 'badge-open', user: 'badge-resolved' };
        document.addEventListener('DOMContentLoaded', async () => {
            const users = await fetchJSON('/api/users');
            if (users) {
                const body = document.getElementById('users-body');
                users.forEach(u => {
                    const roleClass = ROLE_BADGE[u.role] || 'badge-closed';
                    body.insertAdjacentHTML('beforeend', `
                        <tr>
                            <td>#${u.user_id}</td>
                            <td>${u.name}</td>
                            <td style="color:var(--text-secondary)">${u.email}</td>
                            <td><span class="badge ${roleClass}">${u.role}</span></td>
                            <td>${u.department || '<span style="color:var(--text-muted)">—</span>'}</td>
                            <td style="color:var(--text-muted);font-size:.8rem">${new Date(u.created_at).toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'})}</td>
                        </tr>
                    `);
                });
            }
        });
    </script>
</body>

</html>
