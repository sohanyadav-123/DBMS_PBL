<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>IT Helpdesk</h3>
            <small>Admin Portal</small>
        </div>
        <ul class="sidebar-nav">
            <li><a href="/admin_dashboard" class="active">Dashboard</a></li>
            <li><a href="/tickets">Tickets</a></li>
            <li><a href="/assets">Assets</a></li>
            <li><a href="/users">Users</a></li>
            <li><a href="/technicians">Technicians</a></li>
            <li><a href="/categories">Categories</a></li>
            <li><a href="/sla_policies">SLA Policies</a></li>
            <li><a href="/logout">Logout</a></li>
        </ul>
    </div>
    
    <div class="main-content">
        <div class="topbar">
            <h2>Admin Dashboard</h2>
            <div>Welcome, {{ session['name'] }}</div>
        </div>
        
        <div class="content">
            <div id="dashboard-stats" class="stats-grid">
                <!-- Stats loaded via JS -->
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3>Recent Tickets</h3>
                    <a href="/tickets" class="btn btn-primary" style="width:auto;">View All</a>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Ticket ID</th>
                                <th>User</th>
                                <th>Category</th>
                                <th>Priority</th>
                                <th>Technician</th>
                                <th>Status</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="recent-tickets-body">
                            <!-- Loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
