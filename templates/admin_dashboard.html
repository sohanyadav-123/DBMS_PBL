<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — IT Helpdesk Admin</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <div class="sidebar-brand-icon">🛡️</div>
                <div>
                    <h3>IT Helpdesk</h3>
                    <small>Admin Portal</small>
                </div>
            </div>
        </div>
        <ul class="sidebar-nav">
            <li class="nav-section-label">Main</li>
            <li><a href="/admin_dashboard" class="active"><span class="nav-icon">⚡</span> Dashboard</a></li>
            <li><a href="/tickets"><span class="nav-icon">🎫</span> Tickets</a></li>
            <li><a href="/assets"><span class="nav-icon">💻</span> Assets</a></li>
            <li class="nav-section-label">Manage</li>
            <li><a href="/users"><span class="nav-icon">👥</span> Users</a></li>
            <li><a href="/technicians"><span class="nav-icon">🔧</span> Technicians</a></li>
            <li><a href="/categories"><span class="nav-icon">🏷️</span> Categories</a></li>
            <li><a href="/sla_policies"><span class="nav-icon">📋</span> SLA Policies</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="/logout" class="logout-btn"><span>🚪</span> Sign Out</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="topbar">
            <h2>⚡ Dashboard</h2>
            <div class="topbar-user">
                <span class="user-dot"></span>
                {{ session['name'] }}
            </div>
        </div>

        <div class="content">
            <div id="dashboard-stats" class="stats-grid">
                <!-- Stats loaded via JS -->
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>🎫 Recent Tickets</h3>
                    <a href="/tickets" class="btn btn-outline btn-sm">View All →</a>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Ticket ID</th>
                                <th>User</th>
                                <th>Category</th>
                                <th>Priority</th>
                                <th>Technician</th>
                                <th>Status</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="recent-tickets-body">
                            <!-- Loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>

</html>
