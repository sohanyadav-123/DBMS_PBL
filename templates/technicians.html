<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technicians — Admin Portal</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                                <div>
                    <h3>IT Helpdesk</h3>
                    <small>Admin Portal</small>
                </div>
            </div>
        </div>
        <ul class="sidebar-nav">
            <li class="nav-section-label">Main</li>
            <li><a href="/admin_dashboard">Dashboard</a></li>
            <li><a href="/tickets">Tickets</a></li>
            <li><a href="/assets">Assets</a></li>
            <li class="nav-section-label">Manage</li>
            <li><a href="/users">Users</a></li>
            <li><a href="/technicians" class="active">Technicians</a></li>
            <li><a href="/categories">Categories</a></li>
            <li><a href="/sla_policies">SLA Policies</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="/logout" class="logout-btn">Sign Out</a>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h2>Technician Management</h2>
            <div class="topbar-user">
                <span class="user-dot"></span>
                {{ session['name'] }}
            </div>
        </div>

        <div class="content">
            <div class="card">
                <div class="card-header">
                    <h3>All Technicians</h3>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Specialization</th>
                                <th>Email</th>
                            </tr>
                        </thead>
                        <tbody id="tech-body">
                            <!-- Loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const techs = await fetchJSON('/api/technicians');
            if (techs) {
                const body = document.getElementById('tech-body');
                techs.forEach(t => {
                    body.insertAdjacentHTML('beforeend', `
                        <tr>
                            <td>#${t.technician_id}</td>
                            <td>${t.name}</td>
                            <td>${t.specialization || '<span style="color:var(--text-muted)">—</span>'}</td>
                            <td>${t.email}</td>
                        </tr>
                    `);
                });
            }
        });
    </script>
</body>

</html>
